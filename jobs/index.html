<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unity Career Hunter</title>
<meta name="description" content="Unity developer job matches from around the world, scored against my resume, with email drafts and an application tracker.">
<meta name="theme-color" content="#05070b">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 0h26v26l-6 6H0V6z' fill='%23c6ff3d'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' text-anchor='middle' fill='%2305070b'%3EJR%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Dev HQ look (same tokens as the portfolio admin): dark first, light on request. */
:root{
  --bg:#05070b;--panel:#0e131c;--panel2:#141b27;--ink:#e9eef5;--mut:#8a96a8;--line:#1c2533;--line2:#2a3546;
  --acc:#c6ff3d;--acc-ink:#05070b;--acc-soft:rgba(198,255,61,.1);--cyan:#3de0ff;--ok:#c6ff3d;--ok-soft:rgba(198,255,61,.1);--warn:#ffb547;--warn-soft:rgba(255,181,71,.12);--bad:#ff4d6a;
  --ex:#c6ff3d;--st:#3de0ff;--po:#ffb547;--lo:#5a6577;
  --shadow:none;--glow:0 0 0 1px rgba(198,255,61,.35),0 0 24px rgba(198,255,61,.08);--r:4px;
  --cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --cut-sm:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;--f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --grid-dot:rgba(255,255,255,.035);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5ef;--panel:#ffffff;--panel2:#f7f9f3;--ink:#0b0f14;--mut:#556070;--line:#dfe4da;--line2:#c9d0c3;
  --acc:#4c7d00;--acc-ink:#ffffff;--acc-soft:#ecf6d8;--cyan:#0077a3;--ok:#3f7300;--ok-soft:#ecf6d8;--warn:#a85d00;--warn-soft:#fdf0dc;--bad:#c8243f;
  --ex:#4c7d00;--st:#0077a3;--po:#b86a00;--lo:#9aa3ae;--glow:0 0 0 1px #4c7d00;--grid-dot:rgba(0,0,0,.035);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5ef;--panel:#ffffff;--panel2:#f7f9f3;--ink:#0b0f14;--mut:#556070;--line:#dfe4da;--line2:#c9d0c3;
  --acc:#4c7d00;--acc-ink:#ffffff;--acc-soft:#ecf6d8;--cyan:#0077a3;--ok:#3f7300;--ok-soft:#ecf6d8;--warn:#a85d00;--warn-soft:#fdf0dc;--bad:#c8243f;
  --ex:#4c7d00;--st:#0077a3;--po:#b86a00;--lo:#9aa3ae;--glow:0 0 0 1px #4c7d00;--grid-dot:rgba(0,0,0,.035);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body)}
body{background-image:radial-gradient(var(--grid-dot) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3,.jt,.brand b,.stat b{font-family:var(--f-disp)}
h1{text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h2{text-transform:uppercase;letter-spacing:.06em;font-size:13px!important;color:var(--mut);display:flex;align-items:center;gap:8px}
h2::before{content:"//";color:var(--acc);font-family:var(--f-mono)}
.kick{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.label,.navsec,.tbl th,.fhead b,.col h3,nav .count,.chip,.tmeta,.xl,.chart .grid span{font-family:var(--f-mono)}
.stat b{font-variant-numeric:tabular-nums}
::selection{background:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar */
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 18px}
.logo{width:36px;height:36px;background:var(--acc);clip-path:var(--cut-sm);display:grid;place-items:center;color:var(--acc-ink);font:700 13px/1 var(--f-mono)}
.brand b{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.04em}.brand small{color:var(--mut);font:11px var(--f-mono);letter-spacing:.06em}
.navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--lo);margin:16px 10px 6px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 10px;border-radius:0 4px 4px 0;cursor:pointer;color:var(--ink)}
nav button svg{width:17px;height:17px;flex:none;opacity:.6}
nav button:hover{background:var(--panel2)}nav button.on{background:var(--acc-soft);border-left-color:var(--acc);color:var(--acc);font-weight:600}nav button.on svg{opacity:1}
.navfoot{margin:18px 6px 4px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font:11px/1.5 var(--f-mono);color:var(--mut)}
.navfoot a{color:var(--mut)}.navfoot a:hover{color:var(--acc)}
nav .count{margin-left:auto;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--mut)}
/* main */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;gap:10px;align-items:center;padding:12px 24px;max-width:1280px;margin:0 auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;max-width:520px}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%}
main{min-width:0}.content{padding:22px 24px 60px;max-width:1280px;margin:0 auto}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:26px 0 12px}
.mut{color:var(--mut)}.small{font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--acc);text-decoration:none}.btn svg{width:15px;height:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700;clip-path:var(--cut-sm);text-transform:uppercase;letter-spacing:.04em;font-size:12.5px}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}.btn:disabled{opacity:.5;cursor:default}
.btn.done{border-color:var(--ok);color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
/* hero + stats */
.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.stat:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:var(--glow)}
.stat b{display:block;font-size:28px;line-height:1.1;letter-spacing:0}.stat span{color:var(--mut);font:11px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.stat.accent{background:var(--acc);color:var(--acc-ink);border:0;clip-path:var(--cut)}.stat.accent span{color:var(--acc-ink);opacity:.75}
/* job cards */
.jobs{display:flex;flex-direction:column;gap:10px}
.job{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s}
.job:hover{border-color:var(--acc);box-shadow:var(--glow)}
.job,.card,.stat,.tcard,.attn-item{position:relative}
.job::after,.card::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-right:2px solid var(--line2);border-bottom:2px solid var(--line2);pointer-events:none}
.job:hover::after{border-color:var(--acc)}
.ring{--v:0;--c:var(--lo);width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.jt{font-weight:650;font-size:15px;line-height:1.3}.jc{color:var(--mut);font-size:13px;margin:2px 0 7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.stsel{padding:5px 8px;border:1px solid var(--line);border-left:3px solid var(--lo);border-radius:4px;background:var(--panel);color:var(--mut);font:12px var(--f-mono);cursor:pointer;max-width:190px}
.stsel:hover{border-color:var(--acc)}
.stsel.st-toapply{border-left-color:var(--cyan);color:var(--ink)}.stsel.st-applied{border-left-color:var(--po);color:var(--po)}
.stsel.st-interviewing{border-left-color:var(--cyan);color:var(--cyan)}.stsel.st-offer{border-left-color:var(--acc);color:var(--acc)}.stsel.st-closed{border-left-color:var(--lo);color:var(--mut)}
.label{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.l-ex{color:var(--ex)}.l-st{color:var(--st)}.l-po{color:var(--po)}.l-lo{color:var(--lo)}
/* filters */
.qf{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.qf button{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:5px 12px;cursor:pointer;font:12px var(--f-mono);letter-spacing:.02em}
.qf button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:0 0 14px}
.filters input,.filters select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.more>summary{cursor:pointer;color:var(--mut);margin-bottom:10px;list-style:none}details.more>summary::before{content:"▸ "}details.more[open]>summary::before{content:"▾ "}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0}
/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11.5px;color:var(--mut);font-weight:600;background:var(--panel2);text-transform:uppercase;letter-spacing:.04em}
.tbl tr:last-child td{border-bottom:0}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}
.wrap{overflow-x:auto}
/* drawer */
#drawer{position:fixed;inset:0;background:rgba(8,12,20,.45);display:none;z-index:20}#drawer.open{display:block}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(820px,100%);background:var(--bg);overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.25);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.shead{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px 0}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.sbody{padding:18px 20px 60px;display:flex;flex-direction:column;gap:14px}
dl{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;margin:0}dt{color:var(--mut);font-size:12.5px}dd{margin:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
.brk{display:grid;grid-template-columns:200px 60px 1fr;gap:6px 12px;align-items:start;font-size:13px}
/* drafts */
.field{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.fhead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.fhead b{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);flex:1}
.field textarea,.field input{width:100%;border:0;background:var(--panel);padding:12px 14px;outline:none;resize:vertical;font:13.5px/1.55 inherit}
.field textarea{min-height:120px}.field textarea.big{min-height:360px}
textarea.json{width:100%;min-height:440px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);font:12.5px/1.5 var(--f-mono)}
pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px;font:12.5px/1.5 var(--f-mono);max-height:520px;overflow:auto;margin:0}
.notice{background:var(--acc-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:50;pointer-events:none;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}
/* openings over time */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;color:var(--ink)}.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.chart{position:relative;height:230px;margin:18px 0 6px 34px}
.chart .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.chart .grid span{position:absolute;right:100%;margin-right:8px;transform:translateY(-50%);font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.chart .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--mut)}
.chart .b{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:default}
.chart .b i{display:block;background:var(--acc);border-radius:4px 4px 0 0;transition:opacity .12s}
.chart .b:hover i,.chart .b:focus i{opacity:.75}.chart .b:focus{outline:none}
.chart .b.cur i{background:color-mix(in srgb,var(--acc) 70%,var(--ink))}
.xl{display:flex;gap:2px;margin-left:34px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}.xl span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:visible}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;z-index:60;display:none;line-height:1.4;max-width:240px}
/* tracker */
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.funnel .stat{cursor:default}.funnel .stat:hover{transform:none;border-color:var(--line)}
.attn{display:flex;flex-direction:column;gap:8px}
.attn-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.attn-item.due{border-left-color:var(--bad)}.attn-item.todo{border-left-color:var(--acc)}
.attn-item b{font-weight:650}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{margin:2px 4px 2px;font-size:12px;display:flex;justify-content:space-between;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.tcard .tt{font-weight:650;line-height:1.3;cursor:pointer;overflow-wrap:anywhere}.tcard .tt:hover{color:var(--acc)}
.tcard select{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.tmeta{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chip.bad{background:var(--warn-soft);color:var(--bad);border-color:transparent}
.menu-toggle{display:none}
@media (max-width:900px){
  .board{grid-template-columns:1fr;overflow:visible}.attn-item{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}nav{position:fixed;inset:0 30% 0 0;z-index:30;display:none;height:100vh;box-shadow:var(--shadow)}nav.show{display:block}
  .menu-toggle{display:inline-flex}.topin,.content{padding-left:16px;padding-right:16px}
  .job{grid-template-columns:48px 1fr}.actions{grid-column:1/-1;justify-content:flex-start}
  dl,.brk{grid-template-columns:1fr}dt{margin-top:6px}.hide-sm{display:none}
}
/* website copy */
a[href^="/api/export.csv"],a[href^="/reports/"]{display:none!important}
.snap{font-size:12px;color:var(--mut);white-space:nowrap}
@media (max-width:700px){.snap{display:none}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <div class="top"><div class="topin">
      <button class="btn ghost menu-toggle" onclick="toggleNav()" aria-label="Menu">☰</button>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" placeholder="Search jobs, companies, skills…" onkeydown="if(event.key==='Enter')globalSearch(this.value)"></div>
      <div class="grow"></div>
      <a class="btn" id="inboxbtn" target="_blank" rel="noopener" hidden></a>
      <span class="snap" id="snapnote"></span><a class="btn pri" href="../admin.html">← Back to Admin</a><button id="runbtn" hidden></button>
      <button class="btn ghost" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="drawer" onclick="if(event.target.id==='drawer')closeDrawer()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
const __LS='uch-web-tracker';
const __lsGet=(k)=>{try{return localStorage.getItem(k)??sessionStorage.getItem(k);}catch{return null;}};
const __local=()=>{try{return JSON.parse(localStorage.getItem(__LS)||'{}');}catch{return {};}};
const __saveLocal=(a)=>{try{localStorage.setItem(__LS,JSON.stringify(a));}catch{}};
// Dashboard statuses <-> the admin tracker's six statuses
const __D2A={'Saved':'saved','To Apply':'saved','Email Draft Ready':'saved','Applied':'applied','Recruiter Contacted':'applied','No Response':'applied',
  'Interview Scheduled':'interview','Assessment':'interview','Offer Received':'offer','Rejected':'rejected','Closed':'withdrawn'};
const __A2D={saved:'Saved',applied:'Applied',interview:'Interview Scheduled',offer:'Offer Received',rejected:'Rejected',withdrawn:'Closed'};
const __b64dec=(s)=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));

    if(PRESETS[v])return await renderJobs(el,VIEWS.find(x=>x[0]===v)[1]);
    return await ({trends:renderTrends,companies:renderCompanies,contacts:renderContacts,drafts:renderDrafts,tracker:renderTracker,history:renderHistory,settings:renderSettings})[v](el);
  }catch(e){el.innerHTML=`<div class="card">Error: ${esc(e.message)}</div>`;}
}

// ---------- job card ----------
function jobCard(j){
  const chips=[];
  chips.push(`<span class="chip ${j.work_mode==='Remote'&&/Worldwide|India/.test(j.remote_scope||'')?'ok':''}">${esc(j.work_display)}</span>`);
  if(j.place_display&&j.place_display!=='Remote')chips.push(`<span class="chip">📍 ${esc(j.place_display)}</span>`);
  if(j.employment_type&&j.employment_type!=='Not specified')chips.push(`<span class="chip">${esc(j.employment_type)}</span>`);
  if(j.salary_min||j.salary_max||j.salary_text)chips.push(`<span class="chip ok">💰 ${esc(j.salary_display.replace(/ \(.*\)$/,''))}</span>`);
  // Opening date: the employer's posting date when the source gives one; otherwise only the date we found it (never a guessed date)
  const fullDate=(d)=>d?new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
  const calAgo=(d)=>{if(!d)return '';const x=new Date(d),n=Math.round((new Date().setHours(0,0,0,0)-new Date(x.getFullYear(),x.getMonth(),x.getDate()))/86400e3);return n<=0?'today':n===1?'yesterday':n+' days ago';};
  const found=`Found by the radar ${fullDate(j.first_discovered_at)} (${calAgo(j.first_discovered_at)})`;
  chips.push(j.published_at
    ?`<span class="chip date" title="Posted by the employer ${esc(fullDate(j.published_at))} · ${esc(found)}">📅 Opened ${esc(fullDate(j.published_at))} · ${esc(calAgo(j.published_at))}</span>`
    :`<span class="chip date" title="The source did not give a posting date · ${esc(found)}">🔎 Found ${esc(fullDate(j.first_discovered_at))} · posting date not given</span>`);
  if(j.contact?.email)chips.push(`<span class="chip acc">✉ HR email</span>`);
  if(j.draft_id)chips.push(`<span class="chip acc">✎ Draft ready</span>`);
  if(j.status!=='active')chips.push(`<span class="chip warn">${esc(j.status)}</span>`);
  return `<div class="job" onclick="openJob(${j.id})">${ring(j.score,j.score_label)}
   <div style="min-width:0"><div class="label l-${lcls(j.score_label)}">${esc(j.score_label||'')}</div><div class="jt">${esc(j.title)}</div><div class="jc">${esc(j.company_name)}${j.why?` · <span>${esc(j.why.split(';')[0])}</span>`:''}</div><div class="chips">${chips.join('')}</div></div>
   <div class="actions" onclick="event.stopPropagation()">
     ${j.draft_id?`<button class="btn sm" onclick="quickCopy(${j.id},this)">${svg('copy')}Copy email</button>`:''}
     <a class="btn sm" href="${safe(j.apply_url)}" target="_blank" rel="noopener">${svg('ext')}Apply</a>
     ${siteBtn(j.company_website,j.company_name)}
     ${statusSelect(j)}
   </div></div>`;
}
// Application status right on the card, in every list
function statusSelect(j){
  const cur=j.app_status||'',st=cur?stageOf(cur):'';
  return `<select class="stsel ${cur?'st-'+st.replace(/\s/g,'').toLowerCase():''}" data-cur="${esc(cur)}" onchange="cardStatus(${j.id},this)" title="Application status" aria-label="Application status for ${esc(j.title)}">
    ${cur?'':'<option value="" selected>Status: not tracked</option>'}${(META.statuses||[]).map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('')}</select>`;
}
async function cardStatus(id,sel){
  const prev=sel.dataset.cur,status=sel.value;if(!status||status===prev)return;
  // keep the original applied date when the job was already applied to
  const f=smartFields(status,{status:prev,applied_at:prev&&!EARLY.includes(prev)?'kept':null});
  try{
    await api(`/api/jobs/${id}/application`,{method:'POST',body:JSON.stringify(f)});
    sel.dataset.cur=status;sel.className='stsel st-'+stageOf(status).replace(/\s/g,'').toLowerCase();sel.querySelector('option[value=""]')?.remove();
    toast(status+(f.applied_at?' · applied today':'')+(f.follow_up_at?` · reminder ${niceDate(f.follow_up_at)}`:''));refreshStats();
  }catch(e){sel.value=prev;toast(e.message);}
}

   </div></details>
   ${r.rows.length-visibleJobs(r.rows).length?`<p class="small mut">${r.rows.length-visibleJobs(r.rows).length} job(s) on this page hidden by your company filter · <a href="#" onclick="go('settings');return false">Settings</a></p>`:''}

// ---------- job openings over time ----------
const pad2=(n)=>String(n).padStart(2,'0');
const ymd=(x)=>`${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`;
const pdate=(iso)=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d||1);};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Period key a date belongs to: the day, the Monday of its week, YYYY-MM, or YYYY
function periodOf(iso,unit){const x=pdate(iso);if(unit==='day')return iso.slice(0,10);if(unit==='month')return iso.slice(0,7);if(unit==='year')return iso.slice(0,4);x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x);}
function stepBack(key,unit,i){if(unit==='year')return String(+key-i);if(unit==='month'){const x=pdate(key+'-01');x.setMonth(x.getMonth()-i);return ymd(x).slice(0,7);}const x=pdate(key);x.setDate(x.getDate()-(unit==='week'?7*i:i));return ymd(x);}
function periodLabel(key,unit,long){const x=pdate(unit==='month'?key+'-01':unit==='year'?key+'-01-01':key);
  if(unit==='year')return key;if(unit==='month')return MONTHS[x.getMonth()]+(long||x.getMonth()===0?' '+x.getFullYear():'');
  const s=`${x.getDate()} ${MONTHS[x.getMonth()]}`;if(unit==='week'){if(!long)return s;const e=new Date(x);e.setDate(e.getDate()+6);return `Week ${s} – ${e.getDate()} ${MONTHS[e.getMonth()]}`;}return long?s+' '+x.getFullYear():s;}
const TR={unit:'day',series:'all',table:false};
const TR_SPAN={day:30,week:12,month:12,year:5};
function trendTotals(t,series){const k=series==='match'?'n_match':'n_all',today=todayLocal(),sum=(unit)=>t.days.filter(r=>periodOf(r.d,unit)===periodOf(today,unit)).reduce((s,r)=>s+r[k],0);
  return {day:sum('day'),week:sum('week'),month:sum('month'),year:sum('year')};}
async function renderTrends(el){
  const t=await api('/api/trends'),k=TR.series==='match'?'n_match':'n_all',today=todayLocal();
  const first=t.days[0]?.d,tot=trendTotals(t,TR.series);
  // Only periods from the first opening on: earlier ones were never searched, so they are not "zero".
  const cur=periodOf(today,TR.unit),firstP=first?periodOf(first,TR.unit):cur,keys=[];
  for(let i=TR_SPAN[TR.unit]-1;i>=0;i--){const p=stepBack(cur,TR.unit,i);if(p>=firstP)keys.push(p);}
  const by={};for(const r of t.days){const p=periodOf(r.d,TR.unit);const o=by[p]||(by[p]={n:0,all:0,match:0,found:0});o.n+=r[k];o.all+=r.n_all;o.match+=r.n_match;o.found+=r.n_found_date;}
  const vals=keys.map(p=>({p,...(by[p]||{n:0,all:0,match:0,found:0})})),max=Math.max(1,...vals.map(v=>v.n));
  const nice=max<=5?5:max<=10?10:Math.ceil(max/10)*10,step=Math.max(1,Math.ceil(vals.length/10));
  const tile=(v,l,u)=>`<div class="stat ${TR.unit===u?'accent':''}" onclick="TR.unit='${u}';render()"><b>${v}</b><span>${l}</span></div>`;
  const unitBtn=(u,l)=>`<button class="${TR.unit===u?'on':''}" onclick="TR.unit='${u}';render()">${l}</button>`;
  el.innerHTML=`<div class="hero"><div><h1>Job openings</h1><div class="mut">How many Unity openings were posted ${TR.series==='match'?`that match you (score ≥ ${t.potential})`:'in total'} per ${TR.unit}.</div></div>
    <div class="row"><div class="seg">${unitBtn('day','Day')}${unitBtn('week','Week')}${unitBtn('month','Month')}${unitBtn('year','Year')}</div>
    <div class="seg"><button class="${TR.series==='all'?'on':''}" onclick="TR.series='all';render()">All Unity jobs</button><button class="${TR.series==='match'?'on':''}" onclick="TR.series='match';render()">Matching (${t.potential}+)</button></div></div></div>
   <div class="stats">${tile(tot.day,'Today','day')}${tile(tot.week,'This week','week')}${tile(tot.month,'This month','month')}${tile(tot.year,'This year','year')}</div>
   <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between"><b>${TR.series==='match'?'Matching openings':'Unity openings'} per ${TR.unit}${vals.length?` · ${esc(periodLabel(vals[0].p,TR.unit,true))} to now`:''}</b>
     <button class="btn sm" onclick="TR.table=!TR.table;render()">${TR.table?'Show chart':'Show as table'}</button></div>
    ${!vals.length?'<div class="empty">No openings found yet. Run a search first.</div>':TR.table?`<div class="wrap" style="margin-top:12px"><table class="tbl"><tr><th>${TR.unit[0].toUpperCase()+TR.unit.slice(1)}</th><th>All Unity jobs</th><th>Matching (${t.potential}+)</th><th>Date from “first found”</th></tr>${vals.slice().reverse().map(v=>`<tr><td>${esc(periodLabel(v.p,TR.unit,true))}</td><td>${v.all}</td><td>${v.match}</td><td class="mut">${v.found}</td></tr>`).join('')}</table></div>`
    :`<div class="chart" role="img" aria-label="Bar chart of openings per ${TR.unit}">
      ${[1,.5].map(f=>`<div class="grid" style="bottom:${f*100}%"><span>${Math.round(nice*f)}</span></div>`).join('')}<div class="grid" style="bottom:0;border-top:0"><span>0</span></div>
      <div class="bars">${vals.map(v=>`<div class="b ${v.p===cur?'cur':''}" tabindex="0" data-tip="${esc(`<b>${periodLabel(v.p,TR.unit,true)}${v.p===cur?' (so far)':''}</b><br>${v.all} Unity opening${v.all===1?'':'s'}<br>${v.match} matching you`)}"><i style="height:${v.n?Math.max(2,v.n/nice*100):0}%"></i></div>`).join('')}</div></div>
     <div class="xl">${vals.map((v,i)=>`<span>${(vals.length-1-i)%step===0?esc(periodLabel(v.p,TR.unit)):''}</span>`).join('')}</div>`}
   </div>
   <p class="small mut">Counted by the date the company posted the job; when a site doesn't show one, the date it was first found is used. The search looks back ${t.lookback_days} days, so tracking starts on ${first?esc(periodLabel(first,'day',true)):'—'} and earlier ${TR.unit}s aren't shown. Closed openings still count for the ${TR.unit} they were posted in.</p>`;
}

// ---------- smart tracker ----------
const STAGES=[['To apply',['Saved','To Apply','Email Draft Ready']],['Applied',['Applied','Recruiter Contacted']],['Interviewing',['Interview Scheduled','Assessment']],['Offer',['Offer Received']],['Closed',['Rejected','No Response','Closed']]];
const stageOf=(s)=>(STAGES.find(([,l])=>l.includes(s))||STAGES[1])[0];
const CLOSED=['Rejected','No Response','Closed'];
// Days until the next reminder after moving to a status (none for closed ones)
const FOLLOW_DAYS={'Saved':3,'To Apply':2,'Email Draft Ready':2,'Applied':7,'Recruiter Contacted':3,'Assessment':3,'Interview Scheduled':2,'Offer Received':2};
let STALE_DAYS=21;
const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const x=new Date(y,m-1,d+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
const dayDiff=(from,to)=>Math.round((Date.parse(to)-Date.parse(String(from).slice(0,10)))/86400e3);
const niceDate=(iso)=>iso?new Date(iso+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'';
/** Fields to send when a job moves to `status`: applied date on first "Applied", and a fresh follow-up reminder. */
function smartFields(status,cur={}){
  const t=todayLocal(),o={status};
  if(status==='Applied'&&!cur.applied_at)o.applied_at=t;
  if(FOLLOW_DAYS[status]&&(status!==cur.status||!cur.follow_up_at))o.follow_up_at=addDays(t,FOLLOW_DAYS[status]);
  return o;
}
let TRK=[];
const trkRow=(id)=>TRK.find(r=>r.job_id===id)||{};
async function trkPost(id,body,msg){try{await api(`/api/jobs/${id}/application`,{method:'POST',body:JSON.stringify(body)});toast(msg);await refreshStats();if(state.view==='tracker')render();}catch(e){toast(e.message);}}
function trkStatus(id,status){const f=smartFields(status,trkRow(id));trkPost(id,f,status+(f.follow_up_at?` · reminder ${niceDate(f.follow_up_at)}`:''));}
function trkFollowed(id,days=7){const r=trkRow(id),next=addDays(todayLocal(),days);trkPost(id,{status:r.status,follow_up_at:next},`Next reminder ${niceDate(next)}`);}
async function trkCopyFollow(id,btn){try{const d=await api('/api/jobs/'+id),x=d.drafts[0];if(!x)return toast('No draft for this job yet');await copyText(`Subject: Re: ${x.subject}\n\n${x.followup_body}`,'Follow-up email copied');btn.classList.add('done');}catch(e){toast(e.message);}}

function attentionItems(rows,today){
  const out=[];
  for(const r of rows){
    if(CLOSED.includes(r.status))continue;
    const st=stageOf(r.status),due=r.follow_up_at&&r.follow_up_at<=today,late=due?dayDiff(r.follow_up_at,today):0;
    const who=`<b>${esc(r.company_name||'')}</b> · ${esc(r.title||'')}`;
    if(st==='To apply'&&(due||dayDiff(r.updated_at||today,today)>=3))
      out.push({k:'todo',o:0,html:`Apply to ${who}<div class="small mut">Saved ${daysSince(r.updated_at)} and not applied yet</div>`,acts:r.job_id?`<a class="btn sm" href="${safe(r.apply_url)}" target="_blank" rel="noopener">${svg('ext')}Apply</a><button class="btn sm pri" onclick="trkStatus(${r.job_id},'Applied')">${svg('check')}I applied</button><button class="btn sm" onclick="trkStatus(${r.job_id},'Closed')">Skip</button>`:''});
    else if(due)
      out.push({k:'due',o:1,html:`${st==='Interviewing'?'Check on your interview with':st==='Offer'?'Reply to the offer from':'Follow up with'} ${who}<div class="small mut">${late>0?`${late} day${late===1?'':'s'} overdue`:'due today'}${r.applied_at?` · applied ${daysSince(r.applied_at)}`:''}</div>`,
        acts:r.job_id?`<button class="btn sm" onclick="trkCopyFollow(${r.job_id},this)">${svg('copy')}Copy follow-up email</button><button class="btn sm pri" onclick="trkFollowed(${r.job_id})">${svg('check')}Followed up</button>${st==='Applied'?`<button class="btn sm" onclick="trkStatus(${r.job_id},'No Response')">No response</button>`:''}`:''});
    else if(st==='Applied'&&r.applied_at&&dayDiff(r.applied_at,today)>=STALE_DAYS)
      out.push({k:'stale',o:2,html:`No reply from ${who}<div class="small mut">Applied ${daysSince(r.applied_at)}</div>`,
        acts:r.job_id?`<button class="btn sm" onclick="trkStatus(${r.job_id},'No Response')">Mark no response</button><button class="btn sm" onclick="trkFollowed(${r.job_id},0)">Remind me today</button>`:''});
  }
  return out.sort((x,y)=>x.o-y.o);
}

function trackerCard(r,today){
  const closed=CLOSED.includes(r.status),due=!closed&&r.follow_up_at&&r.follow_up_at<=today;
  const remind=!closed&&r.follow_up_at?`<span class="chip ${due?'bad':''}">⏰ ${due?(r.follow_up_at<today?'overdue ':'today '):''}${esc(niceDate(r.follow_up_at))}</span>`:'';
  const ext=!r.job_id;
  return `<div class="tcard">
    <div class="tt" ${ext?'':`onclick="openJob(${r.job_id},'track')"`}>${ext?a(r.ext_url,r.title):esc(r.title)}</div>
    <div class="small mut">${esc(r.company_name||'')}${r.score!=null?` · score ${r.score}`:''}${r.job_status&&r.job_status!=='active'?` · <span class="chip warn">${esc(r.job_status)}</span>`:''}</div>
    <div class="tmeta">${r.applied_at?`<span>Applied ${esc(niceDate(r.applied_at))} · ${daysSince(r.applied_at)}</span>`:'<span>Not applied yet</span>'}${remind}</div>
    ${r.notes?`<div class="small" style="overflow-wrap:anywhere">${esc(String(r.notes).slice(0,140))}${String(r.notes).length>140?'…':''}</div>`:''}
    ${ext?`<a class="btn sm" href="../admin.html#jobs/apps">Edit in Admin</a>`:`<select aria-label="Status" onchange="trkStatus(${r.job_id},this.value)">${META.statuses.map(s=>`<option ${s===r.status?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <div class="row">${stageOf(r.status)==='To apply'?`<a class="btn sm" href="${safe(r.apply_url)}" target="_blank" rel="noopener">${svg('ext')}Apply</a>`:''}${!closed&&stageOf(r.status)!=='To apply'?`<button class="btn sm" onclick="trkFollowed(${r.job_id})" title="Set the next reminder 7 days from today">${svg('check')}Followed up</button>`:''}<button class="btn sm ghost" onclick="openJob(${r.job_id},'track')">${svg('pen')}Notes</button></div>`}
  </div>`;
}

   <h2>Pipeline</h2>

   :'<div class="card empty">Nothing tracked yet. Click ✓ Applied or ☆ Save on any job and it shows up here.</div>'}`;

  ${d.sources.map(s=>`<tr><td>${esc(s.key)}</td><td><span class="chip ${s.last_status==='ok'?'ok':'warn'}">${esc(s.last_status)}</span></td><td>${esc(s.last_success_at?new Date(s.last_success_at).toLocaleString():'—')}</td><td>${s.last_fetched??''}</td><td>${s.last_relevant??''}</td><td class="small mut">${esc(s.last_error||s.limitation||'')}</td></tr>`).join('')}</table></div>
  <h2>Reports</h2><div id="reps" class="card small">loading…</div>`;
  const files=await api('/api/reports');$('#reps').innerHTML=files.map(f=>`<div><a href="/reports/${esc(f)}" target="_blank">${esc(f)}</a></div>`).join('')||'none';
}
async function runSources(id){
  const rows=await api('/api/runs/sources?run='+id);
  $('#rs').innerHTML=`<h2>Run #${id} sources</h2><div class="wrap"><table class="tbl"><tr><th>Source</th><th>Status</th><th>Fetched</th><th>Relevant</th><th>Pages</th><th>Notes</th></tr>${rows.map(r=>`<tr><td>${esc(r.source_key)}</td><td>${esc(r.status)}</td><td>${r.fetched}</td><td>${r.relevant}</td><td>${r.pages}</td><td class="small mut">${esc(r.error||r.limitation||'')}</td></tr>`).join('')}</table></div>`;
}
function prefsCard(note){
  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${String(cur)===v?'selected':''}>${esc(l)}</option>`;
  const homes=VIEWS.filter(v=>v.length>1&&v[0]!=='settings');
  return `<div class="card"><div class="kick">Website</div><b>Preferences</b><div class="small mut">${esc(note)}</div>
   <div class="filters" style="margin-top:12px">
    <label class="small mut">Theme<select id="p-theme">${opt('system','Follow system',PREFS.theme)}${opt('dark','Dark',PREFS.theme)}${opt('light','Light',PREFS.theme)}</select></label>
    <label class="small mut">Open on<select id="p-home">${homes.map(v=>opt(v[0],v[1],PREFS.home)).join('')}</select></label>
    <label class="small mut">Default min score in job lists<input id="p-min" type="number" min="0" max="100" placeholder="none" value="${esc(PREFS.min_score)}"></label>
    <label class="small mut">Follow up after applying (days)<input id="p-fu" type="number" min="1" max="60" value="${esc(PREFS.follow_applied)}"></label>
    <label class="small mut">Flag “no reply” after (days)<input id="p-stale" type="number" min="3" max="120" value="${esc(PREFS.stale_days)}"></label>
    <label class="small mut" style="grid-column:1/-1">Hide these companies (one per line)<textarea id="p-hide" rows="3" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)">${esc((PREFS.hide_companies||[]).join('\n'))}</textarea></label>
   </div><div class="row"><button class="btn pri" onclick="savePrefsForm()">Save preferences</button><button class="btn ghost" onclick="setPrefs({...PREF_DEF});render();toast('Preferences reset')">Reset</button></div></div>`;
}
function savePrefsForm(){
  const n=(id,lo,hi,d)=>{const v=parseInt(fv2(id),10);return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d;};
  setPrefs({theme:fv2('p-theme')||'system',home:fv2('p-home')||'dashboard',min_score:fv2('p-min')?String(n('p-min',0,100,'')):'',
    follow_applied:n('p-fu',1,60,7),stale_days:n('p-stale',3,120,21),hide_companies:[...new Set(fv2('p-hide').split('\n').map(s=>s.trim()).filter(Boolean))]});
  toast(window.RemoteCfg?.ready?'Preferences saved · synced':'Preferences saved');
}
// Website copy: search settings go to the private repo (RemoteCfg, see static-site.js); the computer applies them on its next run.
const SEARCH_LISTS=[['job_titles','Job titles to look for'],['search_terms','Search terms (job boards)'],['priority_countries','Priority countries'],['country_filter','Only these countries (empty = worldwide)'],['exclude_title_keywords','Skip titles containing']];
async function renderWebSettings(el){
  const R=window.RemoteCfg,ok=!!R?.ready,d=(ok&&R.data)||{},pub=META.search_public||{};
  const se={...pub,...(d.search||{})},sc=d.scoring||{},pr=d.profile||{};
  const pending=ok&&d.updated_at&&META.as_of&&d.updated_at>META.as_of;
  const ta=(k,l)=>`<label class="small mut">${esc(l)}<textarea id="s-${k}" rows="5" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font:12.5px/1.5 var(--f-mono)">${esc((se[k]||[]).join('\n'))}</textarea></label>`;
  el.innerHTML=`<div class="hero"><div><div class="kick">Control panel</div><h1>Settings</h1><div class="mut">Preferences change this website. Search settings change what the app on your computer looks for.</div></div></div>
  ${prefsCard(ok?'Synced to your private job-radar repo, so every browser where you are logged in gets them.':'Saved in this browser. Log in to Admin on this site to sync them.')}
  <div class="card"><div class="kick">Search</div><b>Search settings</b>
   ${!ok?`<div class="notice" style="margin-top:10px">Log in to <a href="../admin.html">Admin</a> on this site first. Search settings are saved in your <b>private</b> job-radar repo (never in the public site) and the app on your computer applies them at the start of its next run.</div>`:`
   <div class="small mut">Saved to <code>career-hunter.json</code> in your private repo. ${d.updated_at?`Last saved ${esc(new Date(d.updated_at).toLocaleString())}. `:''}${pending?'<b>Waiting for the next run on your computer</b> to apply them.':d.updated_at?'Applied in the latest update.':''}</div>
   <div class="filters" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:12px">${SEARCH_LISTS.map(([k,l])=>ta(k,l)).join('')}</div>
   <div class="filters" style="margin-top:4px">
    <label class="small mut">Look back (days)<input id="s-lb" type="number" min="1" max="120" value="${esc(se.lookback_days??45)}"></label>
    <label class="small mut">Internships<select id="s-int"><option value="0" ${se.include_internships?'':'selected'}>Hide</option><option value="1" ${se.include_internships?'selected':''}>Include</option></select></label>
    <label class="small mut">Years of experience<input id="s-yrs" type="number" min="0" max="50" placeholder="unchanged" value="${esc(pr.years_experience??'')}"></label>
    <label class="small mut">Notice period<input id="s-np" placeholder="unchanged" value="${esc(pr.notice_period??'')}"></label>
    <label class="small mut">Minimum salary (annual)<input id="s-sal" type="number" min="0" placeholder="unchanged" value="${esc(sc.salary_min_annual??'')}"></label>
    <label class="small mut">Salary currency<input id="s-cur" maxlength="3" placeholder="USD" value="${esc(sc.salary_currency??'')}"></label>
    <label class="small mut" style="grid-column:1/-1">Work authorization / relocation sentence<input id="s-wa" placeholder="unchanged" value="${esc(pr.work_authorization??'')}"></label>
   </div>
   <div class="small mut" style="margin-bottom:10px">Fields left on “unchanged” keep the value set on your computer. Salary, notice period and work authorization stay private: they are only in your private repo.</div>
   <button class="btn pri" onclick="saveWebSearch()">Save search settings</button>`}
  </div>`;
}
async function saveWebSearch(){
  const lines=(id)=>[...new Set(fv2(id).split('\n').map(s=>s.trim()).filter(Boolean))];
  const search={lookback_days:Math.min(120,Math.max(1,parseInt(fv2('s-lb'),10)||45)),include_internships:fv2('s-int')==='1'};
  for(const [k] of SEARCH_LISTS)search[k]=lines('s-'+k);
  if(!search.job_titles.length&&!search.search_terms.length)return toast('Add at least one job title or search term');
  const profile={},scoring={};
  if(fv2('s-yrs'))profile.years_experience=Math.min(50,Math.max(0,parseInt(fv2('s-yrs'),10)||0));
  if(fv2('s-np'))profile.notice_period=fv2('s-np');
  if(fv2('s-wa'))profile.work_authorization=fv2('s-wa');
  if(fv2('s-sal'))scoring.salary_min_annual=Math.max(0,parseInt(fv2('s-sal'),10)||0);
  if(fv2('s-cur')){if(!/^[A-Za-z]{3}$/.test(fv2('s-cur')))return toast('Currency must be a 3-letter code like USD or INR');scoring.salary_currency=fv2('s-cur').toUpperCase();}
  try{await window.RemoteCfg.saveSearch({search,profile,scoring});toast('Saved · applied on your computer at the next run');render();}
  catch(e){toast('Not saved: '+e.message);}
}
async function renderSettings(el){
  if(META.static)return renderWebSettings(el);
  const [p,s]=await Promise.all([api('/api/profile'),api('/api/settings')]);
  el.innerHTML=`<div class="hero"><div><div class="kick">Control panel</div><h1>Settings</h1><div class="mut">Search settings are saved to config/*.json (previous version kept as .bak). API keys belong in .env, never here.</div></div>
    <button class="btn" onclick="rescore()">↻ Re-score all jobs & refresh drafts</button></div>
  ${prefsCard('Saved in this browser only.')}
  <div class="card"><div class="kick">Search</div><b>Quick profile</b><div class="filters" style="margin-top:10px">
    <label class="small mut">Years of experience<input id="q-yrs" type="number" value="${esc(p.years_experience)}"></label>
    <label class="small mut">Notice period (used in drafts)<input id="q-np" placeholder="e.g. 30 days" value="${esc(p.notice_period||'')}"></label>
    <label class="small mut" style="grid-column:span 2">Work authorization / relocation sentence (optional)<input id="q-wa" placeholder="e.g. I'm open to relocation and would need visa sponsorship." value="${esc(p.work_authorization||'')}"></label>
    <label class="small mut">Minimum salary (annual, optional)<input id="q-sal" type="number" value="${esc(s.scoring.salary_min_annual??'')}"></label>
    <label class="small mut">Salary currency<input id="q-cur" value="${esc(s.scoring.salary_currency||'USD')}"></label>
    <label class="small mut">Daily run time (${esc(s.schedule.timezone)})<input id="q-time" type="time" value="${esc(s.schedule.time)}"></label>
    <label class="small mut">Lookback days<input id="q-lb" type="number" value="${esc(s.search.lookback_days)}"></label>
  </div><button class="btn pri" onclick="saveQuick()">Save quick settings</button></div>
  <details class="card"><summary><b>Advanced: full profile JSON</b></summary><div class="row" style="justify-content:flex-end;margin:10px 0"><button class="btn pri" onclick="saveCfg('profile','pj')">Save profile</button></div><textarea class="json" id="pj">${esc(JSON.stringify(p,null,2))}</textarea></details>
  <details class="card"><summary><b>Advanced: search, scoring, sources & company boards JSON</b></summary><div class="row" style="justify-content:flex-end;margin:10px 0"><button class="btn pri" onclick="saveCfg('settings','sj')">Save settings</button></div><textarea class="json" id="sj">${esc(JSON.stringify(s,null,2))}</textarea></details>`;
  window._cfg={p,s};
}
async function saveQuick(){
  const {p,s}=window._cfg;
  p.years_experience=Number(fv2('q-yrs'))||p.years_experience;p.notice_period=fv2('q-np');p.work_authorization=fv2('q-wa');
  s.scoring.salary_min_annual=fv2('q-sal')?Number(fv2('q-sal')):null;s.scoring.salary_currency=fv2('q-cur')||'USD';s.schedule.time=fv2('q-time')||s.schedule.time;s.search.lookback_days=Number(fv2('q-lb'))||s.search.lookback_days;
  await api('/api/profile',{method:'PUT',body:JSON.stringify(p)});await api('/api/settings',{method:'PUT',body:JSON.stringify(s)});
  toast('Saved — click “Re-score” to apply to existing jobs');
}
const fv2=(id)=>($('#'+id)||{}).value?.trim()||'';
async function saveCfg(kind,id){let obj;try{obj=JSON.parse($('#'+id).value);}catch(e){return toast('Invalid JSON: '+e.message);}await api('/api/'+kind,{method:'PUT',body:JSON.stringify(obj)});toast('Saved');}
async function rescore(){toast('Re-scoring…');const r=await api('/api/rescore',{method:'POST'});toast(`Re-scored ${r.rescored} · hidden ${r.filtered} · ${r.drafted} drafts refreshed`);refreshStats();}

applyPrefs();
function setInboxBtn(){const b=$('#inboxbtn');if(!META.inbox)return;b.href=safe(META.inbox.href).replace(/&amp;/g,'&');b.innerHTML=`${svg('mail')}<span class="hide-sm">${esc(META.inbox.label)}</span>`;b.title='Open '+META.inbox.label+' inbox';b.hidden=false;}
(async()=>{META=await api('/api/meta');STATS=await api('/api/stats');setRunBtn();setInboxBtn();go(VIEWS.some(v=>v[0]===PREFS.home)?PREFS.home:'dashboard');if(META.running)poll();})();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#gsearch').focus();}});
</script>
<script>
mkDraft=async()=>toast('New drafts are made by the app on your computer and appear here after the next update');
__load().then(S=>{const n=document.getElementById('snapnote');if(n){n.textContent='Updated '+new Date(S.meta.as_of).toLocaleString()+(Tracker.mode==='remote'?' · tracker synced':' · tracker: this browser');n.title=window.TRACKER_NOTE||'';}}).catch(e=>{document.getElementById('view').innerHTML='<div class="card">'+esc(e.message)+'</div>';});
</script>
</body>
</html>
