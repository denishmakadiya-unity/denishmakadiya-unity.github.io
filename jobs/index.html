<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unity Career Hunter</title>
<style>
:root{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#f8fafc;--ink:#111827;--mut:#64748b;--line:#e3e8ef;
  --acc:#4f46e5;--acc-ink:#ffffff;--acc-soft:#eef0ff;--ok:#0f8a4b;--ok-soft:#e3f7ec;--warn:#b45309;--warn-soft:#fff4e0;--bad:#c2410c;
  --ex:#0f8a4b;--st:#2563eb;--po:#d97706;--lo:#94a3b8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--ink:#e6edf3;--mut:#8b98a8;--line:#27303b;
  --acc:#8b8cff;--acc-ink:#0d1117;--acc-soft:#22264a;--ok:#4cc38a;--ok-soft:#14301f;--warn:#f0a44b;--warn-soft:#33260f;--bad:#ff8a65;
  --ex:#4cc38a;--st:#6ea8ff;--po:#f0a44b;--lo:#64748b;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{
  --bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--ink:#e6edf3;--mut:#8b98a8;--line:#27303b;
  --acc:#8b8cff;--acc-ink:#0d1117;--acc-soft:#22264a;--ok:#4cc38a;--ok-soft:#14301f;--warn:#f0a44b;--warn-soft:#33260f;--bad:#ff8a65;
  --ex:#4cc38a;--st:#6ea8ff;--po:#f0a44b;--lo:#64748b;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar */
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#06b6d4);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.brand b{display:block;font-size:14px}.brand small{color:var(--mut);font-size:12px}
.navsec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 10px 6px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
nav button svg{width:17px;height:17px;flex:none;opacity:.75}
nav button:hover{background:var(--panel2)}nav button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}nav button.on svg{opacity:1}
nav .count{margin-left:auto;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--mut)}
/* main */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;gap:10px;align-items:center;padding:12px 24px;max-width:1280px;margin:0 auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;max-width:520px}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%}
main{min-width:0}.content{padding:22px 24px 60px;max-width:1280px;margin:0 auto}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:26px 0 12px}
.mut{color:var(--mut)}.small{font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--acc);text-decoration:none}.btn svg{width:15px;height:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}.btn:disabled{opacity:.5;cursor:default}
.btn.done{border-color:var(--ok);color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
/* hero + stats */
.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.stat:hover{transform:translateY(-2px);border-color:var(--acc)}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}.stat span{color:var(--mut);font-size:12.5px}
.stat.accent{background:linear-gradient(135deg,var(--acc),#06b6d4);color:#fff;border:0}.stat.accent span{color:rgba(255,255,255,.85)}
/* job cards */
.jobs{display:flex;flex-direction:column;gap:10px}
.job{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s}
.job:hover{border-color:var(--acc)}
.ring{--v:0;--c:var(--lo);width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.jt{font-weight:650;font-size:15px;line-height:1.3}.jc{color:var(--mut);font-size:13px;margin:2px 0 7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.label{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.l-ex{color:var(--ex)}.l-st{color:var(--st)}.l-po{color:var(--po)}.l-lo{color:var(--lo)}
/* filters */
.qf{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.qf button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.qf button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:0 0 14px}
.filters input,.filters select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.more>summary{cursor:pointer;color:var(--mut);margin-bottom:10px;list-style:none}details.more>summary::before{content:"▸ "}details.more[open]>summary::before{content:"▾ "}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0}
/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11.5px;color:var(--mut);font-weight:600;background:var(--panel2);text-transform:uppercase;letter-spacing:.04em}
.tbl tr:last-child td{border-bottom:0}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}
.wrap{overflow-x:auto}
/* drawer */
#drawer{position:fixed;inset:0;background:rgba(8,12,20,.45);display:none;z-index:20}#drawer.open{display:block}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(820px,100%);background:var(--bg);overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.25);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.shead{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px 0}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.sbody{padding:18px 20px 60px;display:flex;flex-direction:column;gap:14px}
dl{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;margin:0}dt{color:var(--mut);font-size:12.5px}dd{margin:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
.brk{display:grid;grid-template-columns:200px 60px 1fr;gap:6px 12px;align-items:start;font-size:13px}
/* drafts */
.field{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.fhead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.fhead b{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);flex:1}
.field textarea,.field input{width:100%;border:0;background:var(--panel);padding:12px 14px;outline:none;resize:vertical;font:13.5px/1.55 inherit}
.field textarea{min-height:120px}.field textarea.big{min-height:360px}
textarea.json{width:100%;min-height:440px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);font:12.5px/1.5 ui-monospace,Consolas,monospace}
pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;max-height:520px;overflow:auto;margin:0}
.notice{background:var(--acc-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:50;pointer-events:none;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}
.menu-toggle{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}nav{position:fixed;inset:0 30% 0 0;z-index:30;display:none;height:100vh;box-shadow:var(--shadow)}nav.show{display:block}
  .menu-toggle{display:inline-flex}.topin,.content{padding-left:16px;padding-right:16px}
  .job{grid-template-columns:48px 1fr}.actions{grid-column:1/-1;justify-content:flex-start}
  dl,.brk{grid-template-columns:1fr}dt{margin-top:6px}.hide-sm{display:none}
}
/* website copy */
a[href^="/api/export.csv"],a[href^="/reports/"]{display:none!important}
.snap{font-size:12px;color:var(--mut);white-space:nowrap}
@media (max-width:700px){.snap{display:none}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <div class="top"><div class="topin">
      <button class="btn ghost menu-toggle" onclick="toggleNav()" aria-label="Menu">☰</button>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" placeholder="Search jobs, companies, skills…" onkeydown="if(event.key==='Enter')globalSearch(this.value)"></div>
      <div class="grow"></div>
      <span class="snap" id="snapnote"></span><a class="btn pri" href="../admin.html">← Back to Admin</a><button id="runbtn" hidden></button>
      <button class="btn ghost" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="drawer" onclick="if(event.target.id==='drawer')closeDrawer()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
let __snap=null;
const __load=()=>__snap||(__snap=fetch('snapshot.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Could not load snapshot.json ('+r.status+')');return r.json();}));
const __LS='uch-web-tracker';
const __local=()=>{try{return JSON.parse(localStorage.getItem(__LS)||'{}');}catch{return {};}};
const __saveLocal=(a)=>{try{localStorage.setItem(__LS,JSON.stringify(a));}catch{}};
function __appOf(S,id){const l=__local()[id];if(l)return l;return (S.applications||[]).find(a=>a.job_id===+id)||null;}
function __allApps(S){const m={};for(const a of S.applications||[])m[a.job_id]=a;Object.assign(m,__local());return Object.values(m);}
const __like=(v,s)=>String(v??'').toLowerCase().includes(String(s).toLowerCase());
const __when=(j)=>j.published_at||j.first_discovered_at||'';
const __cmp=(a,b)=>a<b?1:a>b?-1:0;
function __query(S,f){
  let r=S.jobs;
  if(!f.include_duplicates)r=r.filter(j=>!j.duplicate_of);
  if(f.status&&f.status!=='all')r=r.filter(j=>j.status===f.status);
  if(f.q)r=r.filter(j=>__like(j.title,f.q)||__like(j.company_name,f.q)||__like(j.location_raw,f.q)||__like(S.details[j.id]?.job.description,f.q));
  if(f.country)r=r.filter(j=>__like(j.country,f.country)||__like(j.location_raw,f.country)||__like(j.remote_scope,f.country));
  if(f.title)r=r.filter(j=>__like(j.title,f.title));
  if(f.work_mode)r=r.filter(j=>j.work_mode===f.work_mode);
  if(f.remote_scope)r=r.filter(j=>__like(j.remote_scope,f.remote_scope));
  if(f.employment_type)r=r.filter(j=>__like(j.employment_type,f.employment_type));
  if(f.min_score)r=r.filter(j=>(j.score??-1)>=Number(f.min_score));
  if(f.min_salary)r=r.filter(j=>(j.salary_max??j.salary_min??-1)>=Number(f.min_salary));
  if(f.has_salary)r=r.filter(j=>j.salary_min!=null||j.salary_max!=null||j.salary_text);
  if(f.has_email)r=r.filter(j=>j._has_email);
  if(f.internship==='only')r=r.filter(j=>+j.is_internship===1);else if(f.internship!=='include')r=r.filter(j=>+j.is_internship!==1);
  if(f.new_since)r=r.filter(j=>(j.first_discovered_at||'')>=f.new_since);
  if(f.run_id)r=r.filter(j=>+j.first_run_id===+f.run_id);
  if(f.app_status)r=r.filter(j=>__appOf(S,j.id)?.status===f.app_status);
  const sc=(j)=>j.score??-1,sal=(j)=>j.salary_max??j.salary_min??-1;
  const by={score:(a,b)=>sc(b)-sc(a)||__cmp(__when(a),__when(b)),date:(a,b)=>__cmp(__when(a),__when(b))||sc(b)-sc(a),
    discovered:(a,b)=>__cmp(a.first_discovered_at,b.first_discovered_at)||sc(b)-sc(a),salary:(a,b)=>sal(b)-sal(a)||sc(b)-sc(a)}[f.sort||'score']||((a,b)=>sc(b)-sc(a));
  r=[...r].sort(by);
  const size=f.page_size==='all'?-1:Math.max(1,Number(f.page_size)||50),page=Math.max(1,Number(f.page)||1);
  const rows=(size<0?r:r.slice((page-1)*size,page*size)).map(j=>({...j,app_status:__appOf(S,j.id)?.status||null}));
  return {total:r.length,page,page_size:size,rows};
}
async function staticApi(path,o={}){
  const S=await __load(),u=new URL(path,location.origin),p=u.pathname,q=Object.fromEntries(u.searchParams),method=(o.method||'GET').toUpperCase();
  const m=p.match(/^\/api\/jobs\/(\d+)(\/(application|draft))?$/);
  if(m&&m[3]==='application'&&method==='POST'){
    const id=+m[1],b=JSON.parse(o.body||'{}'),all=__local(),prev=all[id]||__appOf(S,id)||{},ts=new Date().toISOString();
    const rec={job_id:id,status:b.status,updated_at:ts,notes:b.notes||prev.notes||null,
      applied_at:b.applied_at||prev.applied_at||(b.status==='Applied'?ts.slice(0,10):null),follow_up_at:b.follow_up_at||prev.follow_up_at||null,
      history:[{status:b.status,changed_at:ts,note:b.notes||null},...(prev.history||S.details[id]?.app_history||[])]};
    all[id]=rec;__saveLocal(all);return rec;
  }
  if(method!=='GET')throw new Error('Not available on the website. Use the app on your computer for this.');
  if(p==='/api/meta')return {...S.meta};
  if(p==='/api/stats'){
    const apps=__allApps(S),g={},today=new Date().toISOString().slice(0,10);for(const a of apps)g[a.status]=(g[a.status]||0)+1;
    return {...S.stats,applications:Object.entries(g).map(([status,n])=>({status,n})),followups_due:apps.filter(a=>a.follow_up_at&&a.follow_up_at<=today).length};
  }
  if(p==='/api/jobs')return __query(S,q);
  if(m){const d=S.details[m[1]];if(!d)throw new Error('Job not found');const ap=__appOf(S,m[1]);
    return {...d,application:ap,app_history:ap?.history||d.app_history||[]};}
  if(p==='/api/drafts')return S.drafts.map(x=>({...x,app_status:__appOf(S,x.job_id)?.status||null}));
  if(p==='/api/applications'){const byId=Object.fromEntries(S.jobs.map(j=>[j.id,j]));
    return __allApps(S).filter(a=>byId[a.job_id]).map(a=>{const j=byId[a.job_id];return {...a,title:j.title,company_name:j.company_name,posting_url:j.posting_url,apply_url:j.apply_url,score:j.score,job_status:j.status};})
      .sort((a,b)=>__cmp(a.updated_at,b.updated_at));}
  if(p==='/api/companies')return S.companies;
  if(p==='/api/contacts')return S.contacts;
  if(p==='/api/runs')return S.runs;
  if(p==='/api/runs/sources')return S.run_sources[q.run]||[];
  if(p==='/api/reports')return [];
  throw new Error('Not available on the website. Use the app on your computer for this.');
}
</script>
<script>
// ---------- icons ----------
const I = {
  home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  building:'<path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3M3 21h18"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',

const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

const VIEWS=[
  ['Overview'],['dashboard','Dashboard','home'],['new',"Today's new jobs",'spark'],['all','All jobs','list'],['best','Best matches','star'],

  ['Data'],['companies','Companies','users'],['history','Search history','clock']];
const since=(d)=>new Date(Date.now()-d*86400e3).toISOString();
const PRESETS={new:{new_since:()=>since(1)},all:{},best:{min_score:()=>String(META.thresholds.strong||75)},remote:{work_mode:'Remote'},office:{work_mode:'On-site'},hybrid:{work_mode:'Hybrid'},fulltime:{employment_type:'Full-time'},contract:{employment_type:'Contract'}};
let META={statuses:[],thresholds:{}},STATS=null,state={view:'dashboard',f:{}},CUR=null;
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=(u)=>/^https?:\/\//i.test(u||'')?esc(u):'#';
const a=(u,t)=>u&&/^https?:/i.test(u)?`<a href="${safe(u)}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a>`:'<span class="mut">Not publicly available</span>';
const api=staticApi;
const lcls=(l)=>l==='Excellent Match'?'ex':l==='Strong Match'?'st':l==='Potential Match'?'po':'lo';
const ring=(s,l)=>`<div class="ring" style="--v:${s||0};--c:var(--${lcls(l)})"><i>${s??'–'}</i></div>`;
const ago=(d)=>{if(!d)return null;const days=Math.floor((Date.now()-Date.parse(d))/86400e3);return days<=0?'today':days===1?'1 day ago':days<31?days+' days ago':String(d).slice(0,10);};
const d10=(s)=>s?String(s).slice(0,10):'—';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
async function copyText(text,label='Copied'){
  try{await navigator.clipboard.writeText(text);}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  toast(label+' ✓');
}

function toggleTheme(){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('uch-theme',r.dataset.theme);}catch{}}

function nav(){
  const cnt={new:STATS?.new_today,all:STATS?.active,best:STATS?(STATS.excellent+STATS.strong):null,drafts:STATS?.drafts,tracker:STATS?.applications?.reduce((x,y)=>x+y.n,0)};
  $('#nav').innerHTML=`<div class="brand"><div class="logo">UCH</div><div><b>Career Hunter AI</b><small>Unity jobs · worldwide</small></div></div>`+

function go(v,extra={}){state.view=v;state.f={page:1,page_size:30,sort:'score',status:'active'};const p=PRESETS[v]||{};for(const k in p)state.f[k]=typeof p[k]==='function'?p[k]():p[k];Object.assign(state.f,extra);nav();render();$('#nav').classList.remove('show');window.scrollTo(0,0);}
function globalSearch(q){go('all',{q});}

async function render(){
  const v=state.view,el=$('#view');el.innerHTML='<p class="mut">Loading…</p>';
  try{
    if(v==='dashboard')return await renderDash(el);
    if(PRESETS[v])return await renderJobs(el,VIEWS.find(x=>x[0]===v)[1]);
    return await ({companies:renderCompanies,contacts:renderContacts,drafts:renderDrafts,tracker:renderTracker,history:renderHistory,settings:renderSettings})[v](el);
  }catch(e){el.innerHTML=`<div class="card">Error: ${esc(e.message)}</div>`;}
}

// ---------- job card ----------
function jobCard(j){
  const chips=[];
  chips.push(`<span class="chip ${j.work_mode==='Remote'&&/Worldwide|India/.test(j.remote_scope||'')?'ok':''}">${esc(j.work_display)}</span>`);
  if(j.place_display&&j.place_display!=='Remote')chips.push(`<span class="chip">📍 ${esc(j.place_display)}</span>`);
  if(j.employment_type&&j.employment_type!=='Not specified')chips.push(`<span class="chip">${esc(j.employment_type)}</span>`);
  if(j.salary_min||j.salary_max||j.salary_text)chips.push(`<span class="chip ok">💰 ${esc(j.salary_display.replace(/ \(.*\)$/,''))}</span>`);
  const posted=ago(j.published_at);chips.push(`<span class="chip">${posted?'Posted '+posted:'Found '+ago(j.first_discovered_at)}</span>`);
  if(j.contact?.email)chips.push(`<span class="chip acc">✉ HR email</span>`);
  if(j.draft_id)chips.push(`<span class="chip acc">✎ Draft ready</span>`);
  if(j.app_status)chips.push(`<span class="chip warn">${esc(j.app_status)}</span>`);
  if(j.status!=='active')chips.push(`<span class="chip warn">${esc(j.status)}</span>`);
  return `<div class="job" onclick="openJob(${j.id})">${ring(j.score,j.score_label)}
   <div style="min-width:0"><div class="label l-${lcls(j.score_label)}">${esc(j.score_label||'')}</div><div class="jt">${esc(j.title)}</div><div class="jc">${esc(j.company_name)}${j.why?` · <span>${esc(j.why.split(';')[0])}</span>`:''}</div><div class="chips">${chips.join('')}</div></div>
   <div class="actions" onclick="event.stopPropagation()">
     ${j.draft_id?`<button class="btn sm" onclick="quickCopy(${j.id},this)">${svg('copy')}Copy email</button>`:''}
     <a class="btn sm" href="${safe(j.apply_url)}" target="_blank" rel="noopener">${svg('ext')}Apply</a>
     <button class="btn sm ${j.app_status?'done':''}" onclick="quickSave(${j.id},this)" title="Save to tracker">${svg('star')}${j.app_status?'Saved':'Save'}</button>
   </div></div>`;
}
async function quickCopy(id,btn){const d=await api('/api/jobs/'+id);const x=d.drafts[0];if(!x)return toast('No draft yet');await copyText(`Subject: ${x.subject}\n\n${x.body}`,'Email copied');btn.classList.add('done');}
async function quickSave(id,btn){await api(`/api/jobs/${id}/application`,{method:'POST',body:JSON.stringify({status:'Saved'})});btn.classList.add('done');btn.lastChild.textContent='Saved';toast('Saved to tracker');refreshStats();}
async function refreshStats(){STATS=await api('/api/stats');nav();}

// ---------- dashboard ----------
async function renderDash(el){
  STATS=await api('/api/stats');nav();const s=STATS,lr=s.latest_run;
  const top=await api(`/api/jobs?status=active&sort=score&page_size=8&min_score=${META.thresholds.potential||60}`);
  const fresh=await api(`/api/jobs?status=active&sort=discovered&page_size=5&min_score=${META.thresholds.potential||60}&new_since=${since(2)}`);
  const h=new Date().getHours(),greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const stat=(n,l,v,ex='',cls='')=>`<div class="stat ${cls}" onclick="go('${v}'${ex?','+ex:''})"><b>${n??0}</b><span>${l}</span></div>`;
  el.innerHTML=`<div class="hero"><div><h1>${greet}, ${esc(META.name||'')} 👋</h1>
     <div class="mut">${lr?`Last search #${lr.id} · ${esc(lr.status)} · ${esc(new Date(lr.started_at).toLocaleString())}${lr.report_path?` · <a href="/reports/${esc(lr.report_path.split(/[\\/]/).pop())}" target="_blank">open daily report</a>`:''}`:'No search yet — click “Run search”.'}</div></div>
     <div class="row"><a class="btn" href="/api/export.csv?status=active">Export CSV</a><button class="btn" onclick="go('drafts')">${svg('pen')}Email drafts</button></div></div>
   <div class="stats">
     ${stat(s.relevant,'Matching jobs (score ≥ '+META.thresholds.potential+')','all',`{min_score:'${META.thresholds.potential}'}`,'accent')}
     ${stat(s.excellent+s.strong,'Strong + excellent','best')}${stat(s.new_today,'New in last 24h','new')}
     ${stat(s.remote,'Remote','remote')}${stat(s.hybrid,'Hybrid','hybrid')}${stat(s.office,'On-site','office')}
     ${stat(s.drafts,'Drafts ready to copy','drafts')}${stat(s.with_email,'With public HR email','contacts')}
     ${stat(s.followups_due,'Follow-ups due','tracker')}${stat(s.companies,'Companies','companies')}
   </div>
   ${fresh.rows.length?`<h2>🆕 Fresh matches (last 48h)</h2><div class="jobs">${fresh.rows.map(jobCard).join('')}</div>`:''}
   <h2>⭐ Top matches for you</h2><div class="jobs">${top.rows.map(jobCard).join('')||'<div class="card empty">No matches yet.</div>'}</div>
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="go('all',{min_score:'${META.thresholds.potential}'})">See all ${s.relevant} matching jobs →</button></div>`;
}
async function runNow(){try{await api('/api/run',{method:'POST'});META.running=true;setRunBtn();toast('Search started');poll();}catch(e){toast(e.message);}}
function setRunBtn(){const b=$('#runbtn');b.disabled=!!META.running;b.textContent=META.running?'Searching…':'Run search';}

// ---------- job list ----------
async function renderJobs(el,title){
  const f=state.f,qs=new URLSearchParams(Object.entries(f).filter(([,v])=>v!==''&&v!=null)).toString();
  const r=await api('/api/jobs?'+qs),pages=r.page_size>0?Math.max(1,Math.ceil(r.total/r.page_size)):1;
  const sel=(k,opts)=>`<select onchange="setF('${k}',this.value)">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(f[k]??'')===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const P=META.thresholds.potential,S=META.thresholds.strong;
  const quick=[['Strong+ ('+S+'+)',{min_score:String(S)}],['Matching ('+P+'+)',{min_score:String(P)}],['Remote worldwide',{work_mode:'Remote',remote_scope:'Worldwide'}],['Open to India',{country:'India'}],['Has HR email',{has_email:'1'}],['Salary shown',{has_salary:'1'}],['New 24h',{new_since:since(1)}]];
  const isOn=(q)=>Object.entries(q).every(([k,v])=>k==='new_since'?!!f.new_since:String(f[k]??'')===v);
  el.innerHTML=`<div class="hero"><div><h1>${esc(title)}</h1><div class="mut">${r.total} job${r.total===1?'':'s'}${f.q?` matching “${esc(f.q)}”`:''}</div></div>
    <a class="btn" href="/api/export.csv?${qs}">Export ${r.total} as CSV</a></div>
   <div class="qf">${quick.map(([l,q],i)=>`<button class="${isOn(q)?'on':''}" onclick='toggleQuick(${JSON.stringify(q)})'>${esc(l)}</button>`).join('')}</div>
   <details class="more" ${f.q||f.country||f.title||f.employment_type||f.min_salary?'open':''}><summary>More filters & sorting</summary><div class="filters">
    <input placeholder="Keyword…" value="${esc(f.q||'')}" onchange="setF('q',this.value)">
    <input placeholder="Country (e.g. India)" value="${esc(f.country||'')}" onchange="setF('country',this.value)">
    <input placeholder="Title contains…" value="${esc(f.title||'')}" onchange="setF('title',this.value)">
    ${sel('work_mode',[['','Any arrangement'],['Remote','Remote'],['Hybrid','Hybrid'],['On-site','On-site'],['Unknown','Unknown']])}
    ${sel('remote_scope',[['','Any remote scope'],['Worldwide','Worldwide'],['India','Includes India'],['Europe','Europe'],['United States','United States']])}
    ${sel('employment_type',[['','Any type'],['Full-time','Full-time'],['Permanent','Permanent'],['Part-time','Part-time'],['Contract','Contract'],['Freelance','Freelance'],['Temporary','Temporary']])}
    <input type="number" placeholder="Min score" value="${esc(f.min_score||'')}" onchange="setF('min_score',this.value)">
    <input type="number" placeholder="Min salary (annual)" value="${esc(f.min_salary||'')}" onchange="setF('min_salary',this.value)">
    ${sel('status',[['active','Active'],['expired','Expired'],['closed','Closed'],['all','All statuses']])}
    ${sel('internship',[['','Hide internships'],['include','Include internships'],['only','Internships only']])}
    ${sel('sort',[['score','Sort: best match'],['date','Sort: newest posted'],['discovered','Sort: newest found'],['salary','Sort: salary']])}
    ${sel('page_size',[['30','30 per page'],['60','60 per page'],['100','100 per page'],['all','Show all']])}
   </div></details>
   <div class="jobs">${r.rows.map(jobCard).join('')||'<div class="card empty">No jobs match these filters.</div>'}</div>
   ${pages>1?`<div class="pager"><button class="btn" ${f.page<=1?'disabled':''} onclick="setF('page',${f.page-1},true)">‹ Prev</button><span class="mut">Page ${f.page} of ${pages}</span><button class="btn" ${f.page>=pages?'disabled':''} onclick="setF('page',${+f.page+1},true)">Next ›</button></div>`:''}`;
}
function setF(k,v,keepPage){state.f[k]=v;if(!keepPage)state.f.page=1;render();}
function toggleQuick(q){const on=Object.entries(q).every(([k,v])=>k==='new_since'?!!state.f.new_since:String(state.f[k]??'')===v);for(const k in q)state.f[k]=on?'':(k==='new_since'?since(1):q[k]);state.f.page=1;render();}

     <div class="card"><b>HR / recruiter contacts</b>
      ${d.contacts.length?`<div class="wrap" style="margin-top:10px"><table class="tbl"><tr><th>Contact</th><th>Role</th><th>Verification</th><th>Source</th></tr>${d.contacts.map(x=>`<tr><td>${x.email?`<b>${esc(x.email)}</b> <button class="btn sm" onclick="copyText('${esc(x.email)}','Email address copied')">${svg('copy')}</button>`:a(x.contact_url,'Contact / careers page')}${x.name?`<br>${esc(x.name)}`:''}</td><td>${esc(x.role||'')}</td><td>${esc(x.email?x.verification_status:'No email on page')}</td><td>${a(x.source_url,'source')}<br><span class="small mut">${d10(x.checked_at)}</span></td></tr>`).join('')}</table></div>`:'<p class="mut">No public HR contact found. Use the official application link.</p>'}
      <p class="small mut">Emails are only copied from public pages and postings; none are guessed. Being on a page does not prove an address is deliverable.</p></div>`;
  }
  if(tab==='track'){
    const ap=d.application;
    el.innerHTML=`<div class="card"><b>Application status</b>
      <div class="qf" style="margin-top:10px">${META.statuses.map(s=>`<button class="${ap?.status===s?'on':''}" onclick="saveApp(${j.id},'${esc(s)}')">${esc(s)}</button>`).join('')}</div>
      <div class="filters" style="grid-template-columns:1fr 1fr"><label class="small mut">Follow-up date<input id="fu" type="date" value="${esc(ap?.follow_up_at||'')}"></label>
       <label class="small mut">Applied on<input id="ad" type="date" value="${esc(ap?.applied_at||'')}"></label></div>
      <div class="field"><div class="fhead"><b>Notes</b></div><textarea id="nt" placeholder="Interview notes, recruiter name, salary discussed…">${esc(ap?.notes||'')}</textarea></div>
      <div class="row" style="margin-top:10px"><button class="btn pri" onclick="saveApp(${j.id},'${esc(ap?.status||'Saved')}')">Save details</button></div></div>
     ${d.app_history.length?`<div class="card"><b>History</b><div class="small" style="margin-top:8px">${d.app_history.map(h=>`<div>${esc(new Date(h.changed_at).toLocaleString())} → <b>${esc(h.status)}</b>${h.note?` · ${esc(h.note)}`:''}</div>`).join('')}</div></div>`:''}
     <div class="card"><b>Listing history</b><div class="small" style="margin-top:8px">${d.status_history.map(h=>`<div>${esc(new Date(h.changed_at).toLocaleString())} → ${esc(h.status)}${h.note?` · ${esc(h.note)}`:''}</div>`).join('')}</div></div>`;
  }
  if(tab==='desc')el.innerHTML=`<pre>${esc(j.description||'')}</pre>`;
}
function field(id,label,value,big=false,single=false){
  return `<div class="field"><div class="fhead"><b>${esc(label)}</b><button class="btn sm" onclick="copyField('${id}','${esc(label.split(' (')[0])}')">${svg('copy')}Copy</button></div>
   ${single?`<input id="f-${id}" value="${esc(value)}">`:`<textarea id="f-${id}" class="${big?'big':''}">${esc(value)}</textarea>`}</div>`;
}
const fv=(id)=>($('#f-'+id)||{}).value||'';
function copyField(id,label){copyText(fv(id),label+' copied');}
function copyDraftAll(){const x=CUR.drafts[0];const subj=$('#f-subject')?fv('subject'):x.subject,body=$('#f-body')?fv('body'):x.body;copyText(`Subject: ${subj}\n\n${body}`,'Subject + email copied');}
function openMail(e){e.preventDefault();const to=/@/.test(fv('to'))?fv('to').trim():'';location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(fv('subject'))}&body=${encodeURIComponent(fv('body'))}`;}
function closeDrawer(){$('#drawer').classList.remove('open');}
async function saveApp(id,status){await api(`/api/jobs/${id}/application`,{method:'POST',body:JSON.stringify({status,notes:($('#nt')||{}).value||'',follow_up_at:($('#fu')||{}).value||'',applied_at:($('#ad')||{}).value||''})});toast('Saved: '+status);await openJob(id,'track');refreshStats();}
async function mkDraft(id){await api(`/api/jobs/${id}/draft`,{method:'POST'});toast('Draft created');await openJob(id,'draft');refreshStats();}

// ---------- drafts ----------
async function renderDrafts(el){
  const rows=await api('/api/drafts');
  el.innerHTML=`<div class="hero"><div><h1>Email drafts</h1><div class="mut">${rows.length} ready-to-copy drafts for your matching jobs · best matches first · nothing is ever sent automatically</div></div></div>
  <div class="jobs">${rows.map(x=>`<div class="job" onclick="openJob(${x.job_id},'draft')">${ring(x.score,x.score_label)}
    <div style="min-width:0"><div class="jt">${esc(x.title)}</div><div class="jc">${esc(x.company_name)}</div><div class="small mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.subject)}</div>
     <div class="chips" style="margin-top:6px">${x.to_email?`<span class="chip acc">✉ ${esc(x.to_email)}</span>`:'<span class="chip">No HR email · use apply link</span>'}${x.app_status?`<span class="chip warn">${esc(x.app_status)}</span>`:''}</div></div>
    <div class="actions" onclick="event.stopPropagation()"><button class="btn sm" data-i="${x.id}" onclick="copyRow(this,'email')">${svg('copy')}Copy email</button><button class="btn sm" data-i="${x.id}" onclick="copyRow(this,'linkedin')">LinkedIn note</button><a class="btn sm" href="${safe(x.apply_url)}" target="_blank" rel="noopener">${svg('ext')}Apply</a></div></div>`).join('')||'<div class="card empty">No drafts yet. They are created automatically for every job scoring ≥ '+META.thresholds.potential+'.</div>'}</div>`;
  window._drafts=Object.fromEntries(rows.map(r=>[r.id,r]));
}
function copyRow(btn,kind){const x=window._drafts[btn.dataset.i];copyText(kind==='email'?`Subject: ${x.subject}\n\n${x.body}`:x.linkedin_message,kind==='email'?'Email copied':'LinkedIn note copied');btn.classList.add('done');}

// ---------- other pages ----------
async function renderCompanies(el){
  const rows=await api('/api/companies');
  el.innerHTML=`<div class="hero"><div><h1>Companies</h1><div class="mut">${rows.length} companies</div></div></div><div class="wrap"><table class="tbl"><tr><th>Company</th><th>Open jobs</th><th>Best score</th><th class="hide-sm">Type</th><th class="hide-sm">HQ / country</th><th class="hide-sm">Size</th><th>Links</th></tr>
  ${rows.map(c=>`<tr class="click" onclick="go('all',{q:${esc(JSON.stringify(c.name))}})"><td><b>${esc(c.name)}</b><br><span class="small mut">${esc(c.industry||'')}</span></td><td>${c.active_jobs}</td><td>${c.best_score??'—'}</td><td class="hide-sm">${esc(c.classification||'—')}</td><td class="hide-sm">${esc(c.headquarters||'—')}${c.country?`<br><span class="small mut">${esc(c.country)}</span>`:''}</td><td class="hide-sm">${esc(c.size||'Not publicly available')}</td><td onclick="event.stopPropagation()">${c.website?a(c.website,'website'):''} ${c.careers_url?a(c.careers_url,'careers'):''}</td></tr>`).join('')}</table></div>`;
}
async function renderContacts(el){
  const rows=await api('/api/contacts');
  el.innerHTML=`<div class="hero"><div><h1>HR contacts</h1><div class="mut">Only addresses published on official pages or inside postings. Nothing is guessed.</div></div></div>
  <div class="wrap"><table class="tbl"><tr><th>Company</th><th>Email / page</th><th>Role</th><th>Verification</th><th>Source</th><th>Checked</th></tr>
  ${rows.map(x=>`<tr><td><b>${esc(x.company)}</b>${x.job_title?`<br><span class="small mut">${esc(x.job_title)}</span>`:''}</td><td>${x.email?`${esc(x.email)} <button class="btn sm" onclick="copyText('${esc(x.email)}','Email address copied')">${svg('copy')}</button>`:a(x.contact_url,'contact page')}</td><td>${esc(x.role||'')}</td><td>${esc(x.email?x.verification_status:'Not found (page only)')}</td><td>${a(x.source_url,'source')}</td><td>${d10(x.checked_at)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No contacts yet.</td></tr>'}</table></div>`;
}
async function renderTracker(el){
  const rows=await api('/api/applications'),today=new Date().toISOString().slice(0,10);
  const groups=META.statuses.map(s=>[s,rows.filter(r=>r.status===s)]).filter(([,g])=>g.length);
  el.innerHTML=`<div class="hero"><div><h1>Application tracker</h1><div class="mut">${rows.length} tracked · click a job to update it · on this website, changes are saved in this browser only</div></div></div>
  ${groups.map(([s,g])=>`<h2>${esc(s)} <span class="mut">(${g.length})</span></h2><div class="wrap"><table class="tbl"><tr><th>Job</th><th>Score</th><th>Applied</th><th>Follow-up</th><th class="hide-sm">Notes</th><th>Listing</th></tr>${g.map(r=>`<tr class="click" onclick="openJob(${r.job_id},'track')"><td><b>${esc(r.title)}</b><br><span class="small mut">${esc(r.company_name)}</span></td><td>${r.score}</td><td>${esc(r.applied_at||'—')}</td><td>${r.follow_up_at?`<span class="chip ${r.follow_up_at<=today?'warn':''}">${esc(r.follow_up_at)}</span>`:'—'}</td><td class="hide-sm">${esc(r.notes||'')}</td><td>${esc(r.job_status)}</td></tr>`).join('')}</table></div>`).join('')||'<div class="card empty">Nothing tracked yet. Click ☆ Save on any job.</div>'}`;
}
async function renderHistory(el){
  const d=await api('/api/runs');
  el.innerHTML=`<div class="hero"><div><h1>Search history</h1><div class="mut">Every run, every source, and what each source could or could not access.</div></div></div>
  <div class="wrap"><table class="tbl"><tr><th>Run</th><th>Started</th><th>Status</th><th>Trigger</th><th>New</th><th>Updated</th><th>Closed</th><th>Errors</th><th>Report</th></tr>
  ${d.runs.map(r=>`<tr class="click" onclick="runSources(${r.id})"><td>#${r.id}</td><td>${esc(new Date(r.started_at).toLocaleString())}</td><td>${esc(r.status)}</td><td>${esc(r.trigger)}</td><td>${r.new_jobs}</td><td>${r.updated_jobs}</td><td>${r.expired_jobs}</td><td>${JSON.parse(r.errors_json||'[]').length}</td><td onclick="event.stopPropagation()">${r.report_path?`<a href="/reports/${esc(r.report_path.split(/[\\/]/).pop())}" target="_blank">open</a>`:''}</td></tr>`).join('')}</table></div>
  <div id="rs"></div><h2>Sources (latest state)</h2><div class="wrap"><table class="tbl"><tr><th>Source</th><th>Status</th><th>Last success</th><th>Fetched</th><th>Relevant</th><th>Notes / limitation</th></tr>
  ${d.sources.map(s=>`<tr><td>${esc(s.key)}</td><td><span class="chip ${s.last_status==='ok'?'ok':'warn'}">${esc(s.last_status)}</span></td><td>${esc(s.last_success_at?new Date(s.last_success_at).toLocaleString():'—')}</td><td>${s.last_fetched??''}</td><td>${s.last_relevant??''}</td><td class="small mut">${esc(s.last_error||s.limitation||'')}</td></tr>`).join('')}</table></div>
  <h2>Reports</h2><div id="reps" class="card small">loading…</div>`;
  const files=await api('/api/reports');$('#reps').innerHTML=files.map(f=>`<div><a href="/reports/${esc(f)}" target="_blank">${esc(f)}</a></div>`).join('')||'none';
}
async function runSources(id){
  const rows=await api('/api/runs/sources?run='+id);
  $('#rs').innerHTML=`<h2>Run #${id} sources</h2><div class="wrap"><table class="tbl"><tr><th>Source</th><th>Status</th><th>Fetched</th><th>Relevant</th><th>Pages</th><th>Notes</th></tr>${rows.map(r=>`<tr><td>${esc(r.source_key)}</td><td>${esc(r.status)}</td><td>${r.fetched}</td><td>${r.relevant}</td><td>${r.pages}</td><td class="small mut">${esc(r.error||r.limitation||'')}</td></tr>`).join('')}</table></div>`;
}
async function renderSettings(el){
  const [p,s]=await Promise.all([api('/api/profile'),api('/api/settings')]);
  el.innerHTML=`<div class="hero"><div><h1>Settings</h1><div class="mut">Saved to config/*.json (previous version kept as .bak). API keys belong in .env, never here.</div></div>
    <button class="btn" onclick="rescore()">↻ Re-score all jobs & refresh drafts</button></div>
  <div class="card"><b>Quick profile</b><div class="filters" style="margin-top:10px">
    <label class="small mut">Years of experience<input id="q-yrs" type="number" value="${esc(p.years_experience)}"></label>
    <label class="small mut">Notice period (used in drafts)<input id="q-np" placeholder="e.g. 30 days" value="${esc(p.notice_period||'')}"></label>
    <label class="small mut" style="grid-column:span 2">Work authorization / relocation sentence (optional)<input id="q-wa" placeholder="e.g. I'm open to relocation and would need visa sponsorship." value="${esc(p.work_authorization||'')}"></label>
    <label class="small mut">Minimum salary (annual, optional)<input id="q-sal" type="number" value="${esc(s.scoring.salary_min_annual??'')}"></label>
    <label class="small mut">Salary currency<input id="q-cur" value="${esc(s.scoring.salary_currency||'USD')}"></label>
    <label class="small mut">Daily run time (${esc(s.schedule.timezone)})<input id="q-time" type="time" value="${esc(s.schedule.time)}"></label>
    <label class="small mut">Lookback days<input id="q-lb" type="number" value="${esc(s.search.lookback_days)}"></label>
  </div><button class="btn pri" onclick="saveQuick()">Save quick settings</button></div>
  <details class="card"><summary><b>Advanced: full profile JSON</b></summary><div class="row" style="justify-content:flex-end;margin:10px 0"><button class="btn pri" onclick="saveCfg('profile','pj')">Save profile</button></div><textarea class="json" id="pj">${esc(JSON.stringify(p,null,2))}</textarea></details>
  <details class="card"><summary><b>Advanced: search, scoring, sources & company boards JSON</b></summary><div class="row" style="justify-content:flex-end;margin:10px 0"><button class="btn pri" onclick="saveCfg('settings','sj')">Save settings</button></div><textarea class="json" id="sj">${esc(JSON.stringify(s,null,2))}</textarea></details>`;
  window._cfg={p,s};
}
async function saveQuick(){
  const {p,s}=window._cfg;
  p.years_experience=Number(fv2('q-yrs'))||p.years_experience;p.notice_period=fv2('q-np');p.work_authorization=fv2('q-wa');
  s.scoring.salary_min_annual=fv2('q-sal')?Number(fv2('q-sal')):null;s.scoring.salary_currency=fv2('q-cur')||'USD';s.schedule.time=fv2('q-time')||s.schedule.time;s.search.lookback_days=Number(fv2('q-lb'))||s.search.lookback_days;
  await api('/api/profile',{method:'PUT',body:JSON.stringify(p)});await api('/api/settings',{method:'PUT',body:JSON.stringify(s)});
  toast('Saved — click “Re-score” to apply to existing jobs');
}
const fv2=(id)=>($('#'+id)||{}).value?.trim()||'';
async function saveCfg(kind,id){let obj;try{obj=JSON.parse($('#'+id).value);}catch(e){return toast('Invalid JSON: '+e.message);}await api('/api/'+kind,{method:'PUT',body:JSON.stringify(obj)});toast('Saved');}
async function rescore(){toast('Re-scoring…');const r=await api('/api/rescore',{method:'POST'});toast(`Re-scored ${r.rescored} · hidden ${r.filtered} · ${r.drafted} drafts refreshed`);refreshStats();}

(async()=>{META=await api('/api/meta');STATS=await api('/api/stats');setRunBtn();nav();render();if(META.running)poll();})();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#gsearch').focus();}});
</script>
<script>
mkDraft=async()=>toast('New drafts are made by the app on your computer and appear here after the next update');
__load().then(S=>{const n=document.getElementById('snapnote');if(n)n.textContent='Updated '+new Date(S.meta.as_of).toLocaleString();}).catch(e=>{document.getElementById('view').innerHTML='<div class="card">'+esc(e.message)+'</div>';});
</script>
